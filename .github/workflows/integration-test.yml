name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          CI: true

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/**
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build SDK artifacts
        run: npm run build
        env:
          CI: true

      - name: Upload SDK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: |
            dist/**
            build/**
          if-no-files-found: ignore
          retention-days: 14

  chaos-test:
    name: Chaos Resilience Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run chaos experiments
        run: npm run test:chaos
        env:
          CI: true
          CHAOS_ENABLED: 'true'
          CHAOS_SEED: ${{ github.run_id }}

      - name: Upload chaos metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-metrics
          path: |
            chaos-metrics/**
            chaos-report/**
          if-no-files-found: ignore
          retention-days: 14

  notify:
    name: Notify CI Result
    runs-on: ubuntu-latest
    needs: [integration-test, chaos-test]
    if: always()

    steps:
      - name: Report pipeline status
        run: |
          echo "Integration: ${{ needs.integration-test.result }}"
          echo "Chaos: ${{ needs.chaos-test.result }}"
          if [ "${{ needs.integration-test.result }}" != "success" ] || [ "${{ needs.chaos-test.result }}" != "success" ]; then
            echo "::error::CI pipeline failed"
            exit 1
          fi
          echo "CI pipeline passed"
